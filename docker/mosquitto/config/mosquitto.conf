
# Listener for MQTT clients
listener 1883
protocol mqtt

# Optional: WebSocket listener
# listener 9001
# protocol websockets

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Allow anonymous clients (default is false, but good for local dev)
allow_anonymous true

# Uncomment for password-protected broker
# password_file /mosquitto/config/passwordfile